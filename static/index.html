<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>English Speaking AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #222; }
    #record-btn { width: 100%; padding: 16px; font-size: 18px; border: none; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; }
    #record-btn.recording { background: #dc2626; }
    #record-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    #clear-btn { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 4px 10px; cursor: pointer; color: #555; }
    .msg { padding: 10px 14px; margin: 8px 0; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; }
    .msg.user { background: #eef2ff; text-align: right; }
    .msg.ai { background: #f0fdf4; }
    .tip { color: #b45309; font-size: 14px; margin-top: 4px; }
    #status { color: #888; margin: 10px 0; font-size: 14px; min-height: 20px; }
    #status.error { color: #dc2626; }
    #replay-btn { display: none; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>🎙️ English Speaking AI</h2>

  <div class="row">
    <div>
      英语水平：
      <select id="level-select">
        <option value="beginner">初级</option>
        <option value="intermediate" selected>中级</option>
        <option value="advanced">高级</option>
      </select>
    </div>
    <button id="clear-btn">清空对话</button>
  </div>

  <button id="record-btn">🎤 点击开始说话</button>
  <div id="status"></div>
  <button id="replay-btn">▶️ 点击播放 AI 语音</button>
  <div id="chat"></div>

  <script>
    // 对话历史保存在浏览器里，每次请求带给后端（后端不存状态）
    let history = [];
    let mediaRecorder = null;
    let mediaStream = null;
    let audioChunks = [];
    let isRecording = false;
    let busy = false;
    let accessToken = "";
    let lastAudioSrc = null;

    const recordBtn = document.getElementById("record-btn");
    const statusEl = document.getElementById("status");
    const chatEl = document.getElementById("chat");
    const levelSelect = document.getElementById("level-select");
    const replayBtn = document.getElementById("replay-btn");
    const clearBtn = document.getElementById("clear-btn");

    // 复用同一个 Audio 对象：iOS 要求它在用户点击时“解锁”过，之后才允许自动播放
    const player = new Audio();
    // 一段极短的静音 wav，用来解锁
    const SILENT = "data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";

    function safeStorage(op, key, value) {
      try {
        return op === "get" ? localStorage.getItem(key) : localStorage.setItem(key, value);
      } catch (e) { return null; }
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = isError ? "error" : "";
    }

    function setBusy(b) {
      busy = b;
      recordBtn.disabled = b;
    }

    async function ensureToken() {
      try {
        const res = await fetch("/api/auth-required");
        const { required } = await res.json();
        if (!required) return;
        accessToken = safeStorage("get", "access_token") || "";
        if (!accessToken) askToken();
      } catch (e) { /* 忽略，后面请求出错时会提示 */ }
    }

    function askToken() {
      const t = prompt("请输入访问口令：");
      accessToken = (t || "").trim();
      if (accessToken) safeStorage("set", "access_token", accessToken);
    }
    ensureToken();

    recordBtn.addEventListener("click", async () => {
      if (busy) return;
      // 在用户点击的这一刻解锁播放能力（iOS/Safari）
      player.src = SILENT;
      player.play().catch(() => {});
      if (!isRecording) await startRecording();
      else stopRecording();
    });

    function pickMimeType() {
      const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
      for (const t of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    function extFromMime(mime) {
      if (mime.includes("webm")) return "webm";
      if (mime.includes("mp4")) return "mp4";
      if (mime.includes("ogg")) return "ogg";
      return "webm";
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        setStatus("当前浏览器不支持录音，请换 Chrome / Safari 最新版，并使用 https 或 localhost 访问", true);
        return;
      }
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setStatus("无法使用麦克风：请在浏览器地址栏允许麦克风权限", true);
        return;
      }
      const mimeType = pickMimeType();
      mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = sendAudio;
      mediaRecorder.start();
      isRecording = true;
      recordBtn.textContent = "🔴 说完了，点击发送";
      recordBtn.classList.add("recording");
      setStatus("正在录音…");
    }

    function stopRecording() {
      mediaRecorder.stop();
      // 关闭麦克风，避免浏览器一直显示“正在使用麦克风”
      mediaStream.getTracks().forEach((t) => t.stop());
      isRecording = false;
      recordBtn.textContent = "🎤 点击开始说话";
      recordBtn.classList.remove("recording");
    }

    // 把录音统一转成 16kHz 单声道 WAV：所有识别服务（Gemini/Whisper）都认这个格式，
    // 也避开了 Safari(mp4) 与 Chrome(webm) 的格式差异。转换失败就退回原始录音。
    async function toWav(blob) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const ctx = new Ctx();
      const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
      ctx.close();
      const rate = 16000;
      const offline = new Offline(1, Math.max(1, Math.ceil(decoded.duration * rate)), rate);
      const src = offline.createBufferSource();
      src.buffer = decoded;
      src.connect(offline.destination);
      src.start();
      const rendered = await offline.startRendering();
      const pcm = rendered.getChannelData(0);

      const buf = new ArrayBuffer(44 + pcm.length * 2);
      const v = new DataView(buf);
      const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
      w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE");
      w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      w(36, "data"); v.setUint32(40, pcm.length * 2, true);
      for (let i = 0; i < pcm.length; i++) {
        const x = Math.max(-1, Math.min(1, pcm[i]));
        v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true);
      }
      return new Blob([buf], { type: "audio/wav" });
    }

    async function sendAudio() {
      const mime = mediaRecorder.mimeType || "audio/webm";
      const blob = new Blob(audioChunks, { type: mime });
      if (blob.size < 1500) {
        setStatus("没录到声音，请再试一次", true);
        return;
      }

      setBusy(true);
      setStatus("AI 思考中…（识别 → 回复 → 合成语音，约几秒）");

      const form = new FormData();
      let upload = blob, uploadName = "recording." + extFromMime(mime);
      try {
        upload = await toWav(blob);
        uploadName = "recording.wav";
      } catch (e) {
        console.warn("WAV 转换失败，改用原始录音", e);
      }
      form.append("audio", upload, uploadName);
      form.append("history", JSON.stringify(history));
      form.append("level", levelSelect.value);

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          body: form,
          headers: accessToken ? { "X-Access-Token": accessToken } : {},
        });
        if (res.status === 401) {
          safeStorage("set", "access_token", "");
          askToken();
          throw new Error("口令不正确，已重新询问，请再录一次");
        }
        if (!res.ok) {
          let detail = "请求失败（" + res.status + "）";
          try { detail = (await res.json()).detail || detail; } catch (e) {}
          throw new Error(detail);
        }
        const data = await res.json();

        renderMessage("user", data.user_text);
        renderMessage("ai", data.ai_text);

        // 历史里只存正文，不存 Tip
        history.push({ role: "user", content: data.user_text });
        history.push({ role: "assistant", content: data.ai_text.split("💡 Tip:")[0].trim() });
        history = history.slice(-20);

        setStatus("");
        if (data.audio_base64) {
          lastAudioSrc = "data:audio/mp3;base64," + data.audio_base64;
          playAudio();
        } else {
          lastAudioSrc = null;
          setStatus("（这次语音合成失败了，只显示文字）");
        }
      } catch (err) {
        setStatus("出错了：" + err.message, true);
      } finally {
        setBusy(false);
      }
    }

    function renderMessage(role, text) {
      const [main, tip] = text.split("💡 Tip:");
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.appendChild(document.createTextNode(main.trim()));
      if (tip) {
        const tipEl = document.createElement("div");
        tipEl.className = "tip";
        tipEl.textContent = "💡 " + tip.trim();
        div.appendChild(tipEl);
      }
      chatEl.appendChild(div);
      div.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    function playAudio() {
      replayBtn.style.display = "none";
      player.src = lastAudioSrc;
      player.play().catch(() => {
        // 浏览器拦截了自动播放，给一个手动按钮
        replayBtn.style.display = "inline-block";
      });
    }

    replayBtn.addEventListener("click", () => { if (lastAudioSrc) playAudio(); });

    clearBtn.addEventListener("click", () => {
      history = [];
      chatEl.innerHTML = "";
      setStatus("");
    });
  </script>
</body>
</html>
