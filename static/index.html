<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>English Speaking AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    #record-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    #record-btn.recording {
      background: #dc2626;
    }
    #level {
      margin-bottom: 16px;
    }
    .msg {
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 10px;
      line-height: 1.5;
    }
    .msg.user { background: #eef2ff; text-align: right; }
    .msg.ai { background: #f0fdf4; }
    .tip { color: #b45309; font-size: 14px; margin-top: 4px; }
    #status { color: #888; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>🎙️ English Speaking AI</h2>

  <div id="level">
    英语水平：
    <select id="level-select">
      <option value="beginner">初级</option>
      <option value="intermediate" selected>中级</option>
      <option value="advanced">高级</option>
    </select>
  </div>

  <button id="record-btn">按住说话 / 点击开始录音</button>
  <div id="status"></div>
  <div id="chat"></div>

  <script>
    // ---- 全局状态 ----
    let sessionId = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const recordBtn = document.getElementById("record-btn");
    const statusEl = document.getElementById("status");
    const chatEl = document.getElementById("chat");
    const levelSelect = document.getElementById("level-select");

    // 页面加载时先创建一个对话 session
    async function initSession() {
      const res = await fetch("/api/session", { method: "POST" });
      const data = await res.json();
      sessionId = data.session_id;
    }
    initSession();

    // 点击按钮：开始录音 / 停止录音并发送
    recordBtn.addEventListener("click", async () => {
      if (!isRecording) {
        await startRecording();
      } else {
        stopRecording();
      }
    });

    async function startRecording() {
      // 请求麦克风权限（浏览器要求必须是 HTTPS 或 localhost 才能拿到权限）
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = sendAudio;

      mediaRecorder.start();
      isRecording = true;
      recordBtn.textContent = "🔴 点击停止录音";
      recordBtn.classList.add("recording");
      statusEl.textContent = "正在录音...";
    }

    function stopRecording() {
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.textContent = "按住说话 / 点击开始录音";
      recordBtn.classList.remove("recording");
    }

    async function sendAudio() {
      statusEl.textContent = "AI 思考中...";
      const audioBlob = new Blob(audioChunks, { type: "audio/webm" });

      const formData = new FormData();
      formData.append("audio", audioBlob, "recording.webm");
      formData.append("session_id", sessionId);
      formData.append("level", levelSelect.value);

      try {
        const res = await fetch("/api/chat", { method: "POST", body: formData });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "请求失败");
        }
        const data = await res.json();
        renderMessage("user", data.user_text);
        renderMessage("ai", data.ai_text);
        playAudio(data.audio_base64);
        statusEl.textContent = "";
      } catch (err) {
        statusEl.textContent = "出错了：" + err.message;
      }
    }

    function renderMessage(role, text) {
      // 把 "💡 Tip: ..." 部分单独高亮显示，其余作为正常对话内容
      const [main, tip] = text.split("💡 Tip:");
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.innerHTML = main.trim() + (tip ? `<div class="tip">💡 ${tip.trim()}</div>` : "");
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function playAudio(base64Audio) {
      const audio = new Audio("data:audio/mp3;base64," + base64Audio);
      audio.play();
    }
  </script>
</body>
</html>
